<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://maps.google.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#007c75" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="trip-header">
        <div class="hero-media" aria-hidden="true"></div>
        <div class="trip-header__content">
          <div>
            <p class="eyebrow" id="tripEyebrow"></p>
            <h1 id="tripTitle"></h1>
            <div class="trip-summary" id="tripSummary" aria-label="여행 요약"></div>
            <p class="hotel" id="tripHotel"></p>
          </div>
        </div>
      </header>

      <main class="planner">
        <aside class="day-nav" aria-label="일자 선택">
          <button
            class="day-nav__button is-active"
            data-day="all"
            type="button"
            id="allDaysButton"
          ></button>
        </aside>

        <section class="itinerary" id="itinerarySection" aria-label="">
          <div class="section-heading">
            <div>
              <p class="eyebrow" id="itineraryEyebrow"></p>
              <h2 id="itineraryHeading"></h2>
            </div>
            <div class="section-heading__actions">
              <a
                class="compact-link"
                id="openHotelMap"
                target="_blank"
                rel="noreferrer"
              ></a>
              <button class="compact-link" id="exportIcs" type="button"></button>
            </div>
          </div>
          <div class="category-filter" id="categoryFilter"></div>
          <div class="day-list" id="dayList"></div>
        </section>

        <section class="map-panel" aria-label="지도">
          <div class="map-panel__inner">
            <div class="map-toolbar">
              <div>
                <p class="eyebrow" id="mapEyebrow"></p>
                <h2 id="mapTitle"></h2>
              </div>
              <a
                class="map-open-link"
                id="mapOpenLink"
                target="_blank"
                rel="noreferrer"
              ></a>
            </div>
            <div class="map-frame-wrap">
              <iframe
                id="mapFrame"
                title=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen
              ></iframe>
            </div>
            <div class="map-details" id="mapDetails"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="config/trip.config.js"></script>
    <script src="data/itinerary.js"></script>
    <script src="app.js"></script>
  </body>
</html>
